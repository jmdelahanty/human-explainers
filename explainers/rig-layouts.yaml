        path: shadow.json
        lines: [3, 81]
        anchor: arena_center_x_px
      - id: shadow-h-2010093
        source: omnifin0-shadow
        path: calibration_artifacts/homography_arena_1_2010093.yml
        lines: all
      - id: shadow-h-2010094
        source: omnifin0-shadow
